b>の否定で「ゼロ」）<br><br>🎯 <b>例外：依頼・勧誘の疑問文では some</b>：<br>・Would you like <b>some</b> tea?（お茶はいかが？）<br>・なぜ？→ 相手に<b>「ある」前提で勧める</b>ニュアンスだから。「いかが？」は「飲んでね」に近い肯定的な誘い。<br><br>🔄 <b>a few / a little vs few / little</b>：<br>・<b>a</b> がある＝<b>「少しある」</b>（ポジティブ）：I have <b>a few</b> friends.（友達が少しいる）<br>・<b>a</b> がない＝<b>「ほとんどない」</b>（ネガティブ）：I have <b>few</b> friends.（友達がほとんどいない）<br><br>💡 たった1文字の有無で意味が真逆になる。<b>「a」が安心のサイン</b>と覚えると忘れない。</span>","e":"I have <b>some</b> questions. — Do you have <b>any</b> questions?（質問がある／ある？）\nThere is <b>little</b> water.（水はほとんどない）\nI have <b>a few</b> friends.（友達が少しいる）"},{"gr":"中2","t":"比較の発展（最上級の言いかえ）","d":"最上級・比較級を使った頻出の言いかえ。<table class=\"gref-tbl\"><tr><th>表現</th><th>意味</th></tr><tr><td>one of the+<b>最上級</b>+<b>複数</b></td><td>最も〜な…の1つ</td></tr><tr><td>比較級+<b>than any other</b>+単数</td><td>他のどの…より〜</td></tr><tr><td>the+比較級, the+比較級</td><td>〜すればするほど…</td></tr><tr><td>比較級 and 比較級</td><td>だんだん〜</td></tr></table><span class=\"gref-warn\">⚠️ one of the の後は<b>複数形</b>！ one of the <b>tallest boys</b> ／ than any other の後は<b>単数形</b>！ than any other <b>boy</b></span><span class=\"gref-tip\">💡 「一番〜」は最上級だけでなく <b>比較級+than any other</b> でも言える（整序で頻出）</span><span class=\"gref-rel\">🔍 <b>「一番〜」を別の角度から表現する技</b>：最上級だけが「一番〜」を表すわけではない。複数の言い回しを使い分けられると、英語の表現力が一気に増す。<br><br>📐 「富士山は日本で一番高い」を3通りで：<br>・最上級：Mt. Fuji is <b>the highest</b> mountain in Japan.<br>・比較級＋than any other：Mt. Fuji is <b>higher than any other</b> mountain in Japan.<br>・否定＋as〜as：<b>No</b> mountain in Japan is <b>as high as</b> Mt. Fuji.<br><br>🎯 <b>後ろが単数・複数のルール</b>：<br>・<b>one of the 最上級＋複数</b>：「最も〜なうちの<b>1つ</b>」→ 仲間が複数いるから複数形：one of the tallest <b>boys</b>（複数の背の高い男子の中の1人）<br>・<b>比較級＋than any other＋単数</b>：「他のどの<b>1つ</b>より〜」→ 一対一で比べるから単数形：than any other <b>boy</b>（他のどの男子1人より）<br><br>🌱 <b>the+比較級, the+比較級</b>「〜すればするほど…」の語源：もとは「the(その分) 比較級…the(その分) 比較級」という古い英語の名残。日本語の「〜ほど…ほど」と同じ感覚で使える。<br><br>💡 これらの言い換えパターンは<b>整序問題で頻出</b>。「one of the／than any other／no 〜 as〜as」を見たら最上級系と判断できると速い。</span>","e":"Tokyo is <b>one of the largest cities</b> in the world.（世界最大級の都市の1つ）\nHe runs <b>faster than any other</b> student.（他のどの生徒より速く走る）\n<b>The more</b> you read, <b>the more</b> you learn.（読むほど学べる）"},{"gr":"中2","t":"相関接続詞（both A and B など）","d":"2つのものを結ぶペアの接続詞。<table class=\"gref-tbl\"><tr><th>表現</th><th>意味</th></tr><tr><td><b>both A and B</b></td><td>AもBも両方</td></tr><tr><td><b>either A or B</b></td><td>AかBのどちらか</td></tr><tr><td><b>neither A nor B</b></td><td>AもBも〜ない</td></tr><tr><td><b>not only A but also B</b></td><td>AだけでなくBも</td></tr></table><span class=\"gref-warn\">⚠️ <b>動詞の数</b>に注意！ both A and B→<b>複数</b>扱い／either・neither・not only…but also→<b>Bに合わせる</b></span><span class=\"gref-tip\">💡 not only A but also B = B as well as A（書き換え）</span><span class=\"gref-rel\">🔍 <b>「ペアで結ぶ接続詞」の家族関係</b>：4つの相関接続詞は意味でグループ分けすると覚えやすい。<br>・<b>両方OK系</b>：both A and B（AもBも両方）<br>・<b>選ぶ系</b>：either A or B（AかBのどちらか）<br>・<b>両方ダメ系</b>：neither A nor B（AもBも〜ない）← either の否定版<br>・<b>追加系</b>：not only A but also B（AだけでなくBも）<br><br>🎯 <b>動詞の単数・複数（最頻出ポイント）</b>：<br>・<b>both A and B</b> → 2人いるから<b>複数扱い</b>：Both Ken and Tom <b>are</b> kind.<br>・他の3つ（either/neither/not only…but also）→ <b>Bに合わせる</b>（Bが単数なら is、複数なら are）：<br>　Either Tom or his brothers <b>are</b> coming.（Bが複数→ are）<br>　Either his brothers or Tom <b>is</b> coming.（Bが単数→ is）<br><br>🔄 <b>書き換え</b>：<br>・not only A but also B = B <b>as well as</b> A（語順がひっくり返るので注意！）<br>・neither A nor B = not A and not B（両方を否定）<br><br>💡 <b>nor の正体</b>：neither の「n」は否定、nor も否定の or。「<b>nか、nか</b>」と2回否定することで「どちらでもない」を作る。</span>","e":"<b>Both</b> Ken <b>and</b> Tom <b>are</b> kind.（ケンもトムも親切だ）\nHe can speak <b>not only</b> English <b>but also</b> French.（英語だけでなくフランス語も話せる）"},{"gr":"中2","t":"used to（以前は〜だった）","d":"<b>used to+動詞の原形</b>＝「<b>以前はよく〜した</b>／昔は〜だった」（今はもう違う、という含み）。<br><br>📌 I <b>used to</b> play soccer.（昔はよくサッカーをした）<span class=\"gref-warn\">⚠️ 形が似て意味が違う3つに注意！ <b>used to</b>+原形＝以前は〜した／<b>be used to</b>+〜ing形＝〜に慣れている／<b>be used</b>＝使われる（受動態）</span><span class=\"gref-tip\">💡 過去の状態は <b>used to be</b>。There <b>used to be</b> a shop here.（昔ここに店があった）</span><span class=\"gref-rel\">🔍 <b>used to は「過去の習慣・状態」専用</b>：<b>「以前は〜していた／だった」</b>＝<b>今はもう違う</b>という含意。<br><br>📐 I <b>used to</b> play soccer.（昔はよくサッカーをした＝<b>今はもうしていない</b>）<br><br>📐 There <b>used to be</b> a shop here.（昔ここに店があった＝<b>今はもうない</b>）<br><br>🆚 <b>過去形との違い</b>：<br>・過去形「I played soccer yesterday.」＝<b>過去の1回の出来事</b>（昨日サッカーをした）<br>・used to「I used to play soccer.」＝<b>過去の習慣・継続的状態</b>（昔はよくやっていた）<br><br>🚫 <b>形が似てて意味が真逆の3つ</b>：これが入試の最大の引っかけ！<br>・<b>used to + 動詞の原形</b>（以前は〜していた）：I <b>used to play</b> soccer.<br>・<b>be used to + 動詞のing形</b>（〜に慣れている）：I <b>am used to playing</b> soccer.<br>・<b>be used + by</b>（使われる＝受動態）：This pen <b>is used by</b> him.<br><br>🎯 <b>見分け方</b>：to の後ろが<b>動詞の原形</b>なら「以前は〜」、<b>動詞のing形</b>なら「〜に慣れている」、be 動詞があれば受動態の可能性。<br><br>💡 <b>be used to の「to」は前置詞</b>：だから後ろは名詞か動名詞（ing）。不定詞の to（後ろは原形）とは別物。これが混乱の原因。</span>","e":"I <b>used to</b> live in Tokyo.（以前は東京に住んでいた）\nShe is <b>used to</b> getting up early.（早起きに慣れている）"},{"gr":"中2","t":"再帰代名詞（myself / yourself）","d":"<b>〜self（単数）/ 〜selves（複数）</b>＝「〜自身を」。主語＝目的語のとき使う。<table class=\"gref-tbl\"><tr><th>主語</th><th>再帰代名詞</th></tr><tr><td>I / you</td><td>myself / yourself</td></tr><tr><td>he / she / it</td><td>himself / herself / itself</td></tr><tr><td>we / they</td><td>ourselves / themselves</td></tr></table><span class=\"gref-tip\">💡 頻出熟語：<b>by oneself</b>（ひとりで／自分で）/ <b>enjoy oneself</b>（楽しむ）/ <b>help yourself</b>（ご自由にどうぞ）</span><span class=\"gref-rel\">🔍 <b>なぜ「自分自身」が必要？</b>：英語は<b>主語と目的語が同じ時</b>、それを<b>明示する必要がある</b>。<br><br>📐 × I hurt me.（不自然）<br><br>📐 ○ I hurt <b>myself</b>.（自分を傷つけた）<br><br>🤝 日本語でも「自分を傷つけた」と「自分」を入れる感覚と同じ。「私は私を傷つけた」と言うと変だけど「自分を傷つけた」は自然。<br><br>💡 <b>頻出熟語の感覚</b>：<br>・<b>by oneself</b>（一人で／自力で）：「<b>自分自身に頼って</b>」のニュアンス<br>・<b>enjoy oneself</b>（楽しむ）：「<b>自分自身を楽しませる</b>」＝楽しい時間を過ごす<br>・<b>help yourself</b>（ご自由にどうぞ）：「<b>自分自身を助ける</b>」＝自分で取って食べて／飲んで<br><br>🌏 多くの言語に同じ仕組みがある。フランス語・ドイツ語・スペイン語でも「自分自身」を表す代名詞が存在する。</span>","e":"I made it <b>myself</b>.（私が自分で作った）\nHe did his homework <b>by himself</b>.（彼は自分で宿題をやった）\nPlease help <b>yourself</b>.（ご自由にお取りください）"},{"gr":"中3","t":"現在完了：経験（have+過去分詞）","d":"「〜したことがある」。<table class=\"gref-tbl\"><tr><th>用法</th><th>キーワード</th><th>意味</th></tr><tr><td><b>⭐経験</b></td><td>ever/never/once/twice/before</td><td>〜したことがある</td></tr><tr><td>完了</td><td>just/already/yet</td><td>もう〜した</td></tr><tr><td>継続</td><td>for/since</td><td>ずっと〜している</td></tr></table><span class=\"gref-warn\">⚠️ have <b>been to</b>〜＝行ったことがある(今ここにいる)<br>have <b>gone to</b>〜＝行ってしまった(もうここにいない)<br>→ 意味が全然違う！入試超頻出の引っかけ！</span><span class=\"gref-rel\">🔍 <b>現在完了と過去形の本質的な違い</b>：<br><br>📍 <b>過去形</b>は「過去の<b>点</b>」を指す。「I went there yesterday.」は<b>その時のこと</b>だけを言っていて、今とは切れている。<br><br>📈 <b>現在完了</b>は「過去から今への<b>線</b>」。「I have been there.」は<b>過去の経験が今の自分にある</b>状態を表す。今の自分について語っている。<br><br>💡 だから現在完了は<b>「今どうなっているか」</b>を伝える時制。経験（今までに〜した自分がいる）、完了（もう〜し終えた状態）、継続（今もまだ続いている）— 全部「今」とつながっている。<br><br>🚫 <b>yesterday / last year / 〜ago と一緒に使えない理由</b>：これらは「過去の特定の点」を指す語。現在完了は「点」ではなく「線」なので、点を指定する語と組み合わせるとチグハグになる。</span>{{TPL:be}}{{TPL:irreg}}","e":"I have <b>never been</b> to Hokkaido.（北海道に一度も行ったことがない）\nHave you <b>ever</b> eaten soba?（そばを食べたことある？）"},{"gr":"中3","t":"現在完了：完了（have+過去分詞）","d":"「<b>もう〜した/ちょうど〜したところ</b>」<br><br>📌 キーワード：<b>just</b>（ちょうど）/ <b>already</b>（もう・肯定文）/ <b>yet</b>（疑問文＝もう / 否定文＝まだ）<br><span class=\"gref-tip\">💡 <b>yetの使い分け</b>が出る！<br>疑問：Have you finished <b>yet</b>?（<b>もう</b>終わった？）<br>否定：I haven't finished <b>yet</b>.（<b>まだ</b>終わってない）</span><br><span class=\"gref-warn\">⚠️ alreadyの位置：have <b>already</b> done（haveと過去分詞の間！）</span><span class=\"gref-rel\">🔍 <b>完了用法の核</b>：「<b>動作が終わって、その結果が今に残っている</b>」。<br><br>📐 The bus <b>has just left</b>.（バスはちょうど出た→だから<b>今ホームにバスはない</b>）<br><br>📐 I <b>have finished</b> my homework.（宿題終わった→だから<b>今は自由</b>）<br><br>🆚 <b>過去形との違い</b>：<br>・過去形「The bus left an hour ago.」＝<b>1時間前に出た</b>（その時の事実だけ。今は関係ない）<br>・完了「The bus has just left.」＝<b>たった今出た（今もその影響が続いている）</b><br><br>💡 だから <b>just / already / yet</b> は「今との繋がり」を示すサイン語。これらが出てきたら現在完了。<br><br>🎯 <b>3つの用法はすべて「今に繋がる」が共通</b>：経験（今までに〜した自分がいる）、完了（今〜し終わったところ）、継続（今もまだ続いている）。</span>","e":"The bus has <b>just</b> left.（バスがちょうど出たところ）\nHave you finished <b>yet</b>?（もう終わった？）"},{"gr":"中3","t":"現在完了：継続（have+過去分詞）","d":"「<b>ずっと〜している</b>」<br><br>📌 <b>for+期間</b>（for 3 years）/ <b>since+起点</b>（since 2020）/ <b>How long 〜?</b><br><span class=\"gref-tip\">💡 <b>forとsince</b>の見分け：<br>for＋<b>期間の長さ</b>（for 3 years / for a long time）<br>since＋<b>始まりの時点</b>（since 2020 / since I was a child）</span><br><span class=\"gref-warn\">⚠️ 状態動詞(know/live/be)→現在完了<br>動作動詞(study/run)→<b>現在完了進行形</b>！</span><span class=\"gref-warn\">⚠️ <b>yesterday / last year / 〜ago</b>と一緒には使えない！<br>× I have lived here <b>yesterday</b> → ○ I <b>lived</b> here yesterday<br>→ 過去の特定の時点には<b>過去形</b>を使う！</span><span class=\"gref-rel\">🔍 <b>継続用法の核</b>：「<b>過去のある時点から始まって、今もずっと続いている</b>」。<br><br>📐 I <b>have lived</b> here for 10 years.（10年前から住み始めて、<b>今も住んでいる</b>）<br><br>🆚 <b>過去形との違い</b>：<br>・過去形「I lived in Tokyo.」＝<b>東京に住んでいた</b>（今は住んでいない）<br>・継続「I have lived in Tokyo for 10 years.」＝<b>10年前から今も</b>東京に住んでいる<br><br>🤝 <b>状態動詞限定の理由</b>：live, know, be, like などは<b>状態</b>を表す動詞。「ずっとその状態」が自然。<br><br>🏃 一方、study, run, play は<b>動作</b>動詞。「ずっと走り続けている」は<b>現在完了進行形</b>（have been running）で表す。状態は「ある」、動作は「し続けている」と区別する。<br><br>💡 for + 期間 / since + 起点 のセット。日本語の「〜から」「〜の間」と同じ感覚。</span>","e":"I have lived here <b>for</b> ten years.（ここに10年住んでいる）\nFriends <b>since</b> 2020.（2020年からの友達）"},{"gr":"中3","t":"現在完了進行形（have been〜ing）","d":"「<b>ずっと〜し続けている</b>」。<b>動作</b>の継続に使う。<br><br>📌 I have <b>been studying</b> for 3 hours.（3時間ずっと勉強している）<br><span class=\"gref-tip\">💡 使い分け：<b>状態</b>動詞(know/live/be)→現在完了 / <b>動作</b>動詞(study/run)→現在完了進行形</span><br><span class=\"gref-warn\">⚠️ for/sinceと一緒に使う点は継続用法と同じ！</span><span class=\"gref-rel\">🔍 <b>現在完了進行形と現在完了「継続」の使い分け</b>：両方とも「ずっと〜している」を表すが、対応する動詞が違う。<br>・<b>現在完了の継続</b>（have+過去分詞）→ <b>状態動詞</b>と相性◎<br>・<b>現在完了進行形</b>（have been+ing）→ <b>動作動詞</b>と相性◎<br><br>📐 <b>状態動詞</b>：live, know, be, like, love, have（持つ）など<br>・I <b>have lived</b> here for 10 years.（10年住んでいる←「住んでいる状態」がずっと）<br><br>📐 <b>動作動詞</b>：study, run, play, work, wait, rain など<br>・I <b>have been studying</b> for 3 hours.（3時間勉強し続けている←「勉強する動作」がずっと）<br><br>🎯 <b>なぜ進行形になる？</b>：状態は「ある」だけで時間が流れる。動作は「やる」を続けると進行形になる。<br>・「ずっと住んでいる」＝ずっと状態が続く＝ have lived（進行形にしない）<br>・「ずっと勉強し続けている」＝動作を継続中＝ have been studying（be+ing で「進行中」を表す）<br><br>🌱 <b>2つの完了形が組み合わさった形</b>：have＋過去分詞（完了）＋be＋ing（進行）＝「過去から今までずっと進行中」。<br><br>💡 for / since の使い方は継続用法と同じ。「for 3 years」「since 2020」と組み合わせる。</span>","e":"I have <b>been studying</b> for 3 hours.（3時間ずっと勉強している）\nIt has <b>been raining</b> since morning.（朝からずっと雨が降っている）"},{"gr":"中3","t":"現在分詞の後置修飾（〜ing）","d":"名詞を後ろから「<b>〜している○○</b>」と説明。<br><br>📌 the boy <b>playing</b> tennis（テニスをしている少年）/ the girl <b>singing</b> on the stage（ステージで歌っている少女）<br><span class=\"gref-warn\">⚠️ 進行形と間違えるな！<br>進行形：The boy <b>is playing</b> tennis.（文の動詞）<br>後置修飾：The boy <b>playing</b> tennis <b>is</b> my friend.（名詞を修飾）</span><br><span class=\"gref-tip\">💡 〜ing（している）vs 過去分詞（された）の使い分けが入試に出る！</span><span class=\"gref-rel\">🔍 <b>進行形と何が違う？</b>：実はどちらも ing は「〜している」という同じ意味。<b>役割の違い</b>だけ。<br><br>📐 <b>進行形</b>「The boy <b>is playing</b> tennis.」では、be動詞 is が「今その状態だ」と<b>断言する文の核</b>になる。<br><br>📐 <b>後置修飾</b>「The boy <b>playing</b> tennis is my friend.」では、ing だけが残って「〜している」という<b>飾り（形容詞）</b>として名詞 boy にくっつく。文の核は別にある（is my friend）。<br><br>🌱 つまり <b>ing は元々「〜している状態」を表す形容詞的な部品</b>。<b>be動詞とセット</b>になれば進行形、<b>名詞の後ろ</b>に置けば後置修飾。<b>同じ部品の使い回し</b>なんだ。<br><br>💡 だから「The boy playing tennis」と「The boy is playing tennis」は意味は重なるけど、役割（飾りか文か）が違う。</span>","e":"The man <b>playing</b> the guitar is my brother.（ギターを弾いている男の人は私の兄だ）\nThe boy <b>running</b> over there is my friend.（あそこで走っている男の子は友達だ）"},{"gr":"中3","t":"過去分詞の後置修飾","d":"名詞を後ろから「<b>〜された○○</b>」と説明。<br><br>📌 a book <b>written</b> in English（英語で書かれた本）/ the picture <b>taken</b> by him（彼が撮った写真）/ the city <b>called</b> Naha（那覇という都市）<br><span class=\"gref-tip\">💡 超頻出パターン丸暗記！<br><b>made in</b>〜（〜製）/ <b>written in</b>〜（〜語で書かれた）/ <b>spoken in</b>〜 / <b>called</b>〜（〜と呼ばれる）</span><br><span class=\"gref-warn\">⚠️ <b>過去分詞+by〜（〜によって）</b>を見たら受動態か後置修飾！</span><span class=\"gref-rel\">🔍 <b>受動態と何が違う？</b>：過去分詞は<b>「〜された状態」を表す形容詞的な部品</b>。<br><br>📐 <b>受動態</b>「The book <b>is written</b> in English.」は、be動詞 is とセットで「〜された状態にある」と<b>文の核</b>を作る。<br><br>📐 <b>後置修飾</b>「a book <b>written</b> in English」は、written だけで名詞 book にくっつく<b>飾り</b>。文の核は別にある。<br><br>🤝 <b>ing と過去分詞は能動／受動のペア</b>：<br>・the boy <b>playing</b> tennis（テニスをしている少年）← 自分でやる側<br>・the book <b>written</b> by him（彼によって書かれた本）← される側<br><br>💡 これは中3で習う関係代名詞（who plays / which was written）の<b>短縮形</b>とも言える。後置修飾を理解しておくと、関係代名詞がスッと入る。</span>","e":"a book <b>written</b> in English（英語で書かれた本）\nthe city <b>called</b> Naha（那覇と呼ばれる都市）"},{"gr":"中3","t":"関係代名詞の主格（who/which/that）","d":"<table class=\"gref-tbl\"><tr><th></th><th>人</th><th>モノ・動物</th><th>両方OK</th></tr><tr><td><b>主格</b></td><td>who</td><td>which</td><td>that</td></tr><tr><td><b>目的格</b></td><td>who(m)<span style=\"font-size:10px;opacity:.65;display:block;line-height:1.2;margin-top:2px\">※whomは発展</span></td><td>which</td><td>that(省略可)</td></tr><tr><td><b>所有格</b></td><td colspan=\"3\">whose</td></tr></table>名詞を後ろから文で説明。(　)の直後に<b>動詞</b>が来たら→<b>主格</b>。<br>人→<b>who</b> / モノ・動物→<b>which</b> / どちらでもOK→<b>that</b><span class=\"gref-tip\">💡 見分けテク：(　)の後が動詞→主格 / (　)の後が主語+動詞→目的格</span><span class=\"gref-rel\">🔍 <b>なぜ日本語と語順が逆？</b>：日本語は<b>修飾語→名詞</b>の順で説明する（「英語を話す＋友達」）。英語は<b>名詞→修飾語</b>の順（friend + who speaks English）。これは英語が<b>「まず話題を出してから補足する」</b>言語だから。<br><br>📐 <b>関係代名詞の正体は「2つの文をつなぐ接着剤」</b>：<br>① I have a friend.<br>② He speaks English.（彼は英語を話す）<br>→ ②の主語 He を <b>who</b>（＝「その人」）に置き換えて、①の friend の<b>すぐ後ろにつなぐ</b>。<br>→ I have a friend <b>who</b> speaks English.<br><br>💡 つまり who / which は<b>「人／モノを指す代名詞」と「文をつなぐ接続詞」の二刀流</b>。だから「関係＋代名詞」と呼ばれる。<br><br>🎯 <b>主格＝置き換えた語が「主語」</b>だったとき。He → who、It → which。</span>{{TPL:pron}}","e":"a friend <b>who speaks</b> English（英語を話す友達）\nthe cat <b>which was</b> born last week（先週生まれた猫）"},{"gr":"中3","t":"関係代名詞の目的格（省略可能）","d":"(　)の後に<b>主語+動詞</b>→<b>目的格</b>！<b>省略できる</b>！<br><br>📌 the book (which) <b>I bought</b>（私が買った本）/ the girl (whom) <b>he likes</b>（彼が好きな少女）<br><span class=\"gref-tip\">💡 <b>省略の見分け</b>：名詞のすぐ後に主語+動詞→関係代名詞が省略！<br>This is the cake <b>my mother made</b>.</span><br><span class=\"gref-warn\">⚠️ 整序で最頻出！関係代名詞節の後に<b>本文の動詞</b>が来る！</span><span class=\"gref-rel\">🔍 <b>なぜ目的格は省略できる？</b>：英語には<b>「名詞のすぐ後ろに〈主語＋動詞〉が来たら、それは前の名詞を説明している」</b>という暗黙のルールがある。<br><br>📐 例：「the book I bought」を見たら、「book という名詞の後ろにいきなり I（主語）＋bought（動詞）が来た→これは『私が買った本』だな」と<b>誰でも推測できる</b>。だから which/that がなくても誤解しない。<br><br>🚫 <b>主格は省略できない理由</b>：「the friend speaks English」だと「友達は英語を話す」という<b>普通の文に見えてしまい</b>、これが修飾なのか文なのか区別できない。主格 who/which を置くことで「ここから修飾だよ」と<b>明示する必要がある</b>。<br><br>💡 つまり省略の可否は<b>「省略しても意味がわかるかどうか」</b>で決まっている。英語の合理的なルール。</span>{{TPL:pron}}","e":"the camera <b>(which) my father gave</b> me（父がくれたカメラ）\nThis is the song <b>(that) I like</b> the most.（これは私が一番好きな歌だ）"},{"gr":"中3","t":"関係代名詞の所有格（whose）","d":"<b>whose</b>＝「〜の」。人にもモノにも使える。<br><br>📌 the boy <b>whose</b> father is a doctor（父親が医者の少年）/ the house <b>whose</b> roof is red（屋根が赤い家）<br><span class=\"gref-tip\">💡 見分け：(　)の後に<b>名詞</b>→<b>whose</b>！<br>who→後に動詞 / which→後に動詞 / <b>whose→後に名詞</b></span><br><span class=\"gref-warn\">⚠️ whose ≠ who's(=who is) 音は同じで意味が違う！</span><span class=\"gref-rel\">🔍 <b>whose の正体</b>：「<b>誰の〜</b>」「<b>その〜の</b>」を関係代名詞にした形。所有格 his/her/its の代わり。<br><br>📐 2文を1文にする：<br>① I know a boy.（私はある少年を知っている）<br>② <b>His</b> father is a doctor.（彼の父は医者だ）<br>→ <b>His</b> を <b>whose</b> に変えて a boy のうしろにつなぐ：<br>→ I know a boy <b>whose</b> father is a doctor.（父親が医者の少年を知っている）<br><br>🎯 <b>見分け方が他と違う</b>：<br>・<b>who / which</b> の後ろ → <b>動詞</b>（主格だから）<br>・<b>目的格 who(m)/which</b> の後ろ → <b>主語＋動詞</b>（省略可能）<br>・<b>whose</b> の後ろ → <b>名詞</b>（所有格だから、必ず「持ち物の名詞」が続く）<br><br>🤝 <b>人にもモノにも使える</b>：所有格は who（人専用）/ which（モノ専用）と違って、whose は<b>両方に使える</b>。<br>・the boy <b>whose</b> father is a doctor（人）<br>・the house <b>whose</b> roof is red（モノ）<br><br>⚠️ <b>whose ≠ who's</b>：音は同じ「フーズ」だが、who's は who is の短縮形。リスニングや会話で混同しやすい要注意ペア。</span>{{TPL:pron}}","e":"a boy <b>whose</b> father is a doctor（父親が医者の男の子）\nthe cat <b>whose</b> eyes are blue（青い目の猫）"},{"gr":"中3","t":"too〜to…（〜すぎて…できない）","d":"<b>too+形容詞+to+動詞</b>＝「〜<b>すぎて</b>…<b>できない</b>」<br><br>📌 too tired <b>to</b> study（疲れすぎて勉強できない）<br><span class=\"gref-tip\">💡 <b>書き換え超頻出！</b><br>too〜to… = <b>so〜that can't…</b><br>too tired to study = so tired that I can't study</span><br><span class=\"gref-warn\">⚠️ not〜enough to…も書き換えパターン！</span><span class=\"gref-rel\">🔍 <b>too の正体</b>：too は本来<b>「〜すぎる」というネガティブニュアンス</b>。「many books」はたくさんの本（中立）だけど「too many books」は<b>多すぎる本</b>（問題）。<br><br>📐 <b>too + 形容詞 + to do</b>の構造：<br>・「too tired」＝<b>疲れすぎ</b>（ネガティブ）<br>・「to study」＝<b>勉強するには／勉強する方向に</b><br>・合わせて＝「勉強するには疲れすぎ」＝勉強できない<br><br>💡 つまり<b>「too（〜すぎる）＋ to（〜には）」</b>を組み合わせるだけで、文法ルールを覚えなくても<b>「〜できない」という否定の結果が自然に表れる</b>。<br><br>🔄 <b>so〜that…can't との書き換え</b>：意味は同じだが too〜to は短く言える便利な形。逆に so〜that は that のあとに「主語＋動詞」が来るので情報量を増やせる。</span>","e":"I'm <b>too tired to</b> study.（疲れすぎて勉強できない）\nThis box is <b>too heavy to</b> carry.（この箱は重すぎて運べない）\nHe is tall <b>enough to</b> reach the shelf.（彼は棚に手が届くほど背が高い）"},{"gr":"中3","t":"原形不定詞（help/make/let+人+原形）","d":"<b>make/let/help+人+動詞の原形</b>（toなし！）<table class=\"gref-tbl\"><tr><th>動詞</th><th>意味</th><th>例</th></tr><tr><td><b>make</b></td><td>〜させる（強制）</td><td>make him clean</td></tr><tr><td><b>let</b></td><td>〜させてあげる（許可）</td><td>let me go</td></tr><tr><td><b>help</b></td><td>〜を手伝う</td><td>help me carry</td></tr></table><span class=\"gref-warn\">⚠️ tell/ask/wantは<b>to必要</b>！ make/let/helpは<b>toなし</b>！</span><span class=\"gref-tip\">💡 <b>知覚動詞</b>(see/hear/feel)も〈人＋動詞の原形〉！<br>I <b>saw him enter</b> the room.（彼が入るのを見た）<br>I <b>heard someone call</b> my name.（誰かが名前を呼ぶのを聞いた）</span><span class=\"gref-rel\">🔍 <b>なぜtoがない？</b>：toは本来「〜に向かって」という<b>距離</b>のニュアンスを持つ語。tell/ask/wantは「言って→相手が動く」「頼んで→相手が動く」と<b>ワンクッション</b>あるからto（向かう先）が必要。一方make/let/helpは「直接させる／させてあげる／手伝う」と<b>相手と動作がぴったりくっついている</b>から、距離を表すtoは不要なんだ。<br><br>👁️ <b>知覚動詞も同じ理由</b>：「見る・聞く・感じる」は<b>その場で直接体験</b>すること。「彼が入る<b>のを</b>見た」は、入る動作と見る動作が同時進行。距離感がないからtoは入らない。</span>","e":"Please <b>help me carry</b> this.（これを運ぶのを手伝って）\nMy mother <b>made me clean</b> my room.（母に部屋を掃除させられた）\nI <b>saw him run</b> fast.（彼が速く走るのを見た）"},{"gr":"中3","t":"間接疑問文","d":"疑問の内容を文中に入れる。<b>疑問詞+主語+動詞</b>（普通の語順に戻す！）<br><br>📌 I know <b>where he lives</b>.（彼がどこに住んでいるか知っている）/ Tell me <b>what you want</b>.（何がほしいか教えて）<br><span class=\"gref-warn\">⚠️ <b>語順ひっくり返る</b>のが最大のポイント！<br>普通：Where <b>does</b> he live?<br>間接：where he <b>lives</b> ← doesが消えてsが戻る！</span><br><span class=\"gref-tip\">💡 <b>疑問詞が主語のとき</b>は〈疑問詞＋動詞〉！主語は入れない。<br>I know <b>who broke</b> the window.（誰が割ったか）<br>Do you know <b>who made</b> this cake?（誰が作ったか）<br>→ doは入れず、動詞の形もそのまま（3単現のsも残る）</span><br><span class=\"gref-tip\">💡 <b>Yes/Noで答える疑問文</b>を入れるときは <b>if / whether</b>「〜かどうか」！<br>Is he busy? → I don't know <b>if</b> he <b>is</b> busy.<br>I'm not sure <b>whether</b> it's true (<b>or not</b>).</span><br><span class=\"gref-tip\">💡 疑問詞+to+動詞もセット！<br>what to buy / how to get there / where to go<br><br>⚠️ <b>why to〜は存在しない</b>！</span><span class=\"gref-rel\">🔍 <b>なぜ語順を「ふつう」に戻す？</b>：疑問文の語順（Do you 〜? / Where does he 〜?）は<b>相手に問いかけるとき</b>の形。<br><br>📐 でも間接疑問文では「彼がどこに住んでいるか」は<b>もう問いかけではなく、ひとつの情報のかたまり</b>として文の中に組み込まれる。<br><br>📐 比較：<br>・ふつうの疑問文：<b>Where does he live?</b>（君に問いかけている）<br>・間接疑問文：I know <b>where he lives</b>.（情報として組み込まれている。「彼の住んでいる場所」というひとかたまり）<br><br>💡 問いかけの語順は不要になるから、<b>ふつうの文の語順（主語＋動詞）に戻す</b>。<br><br>🎯 <b>疑問詞が主語のとき例外</b>：「Who broke it?」は<b>もともと疑問詞＝主語</b>で語順がふつう文と同じ。だからそのまま間接化できる（I know who broke it.）。do も入らない、s も消えない。</span>","e":"Do you know <b>where he lives</b>?（彼がどこに住んでいるか知ってる？）\nI know <b>who broke</b> the window.（誰が窓を割ったか知っている）\nI don't know <b>if</b> she <b>will come</b>.（彼女が来るかどうかわからない）"},{"gr":"中3","t":"疑問詞＋不定詞（how to / what to）","d":"<b>疑問詞＋to＋動詞の原形</b>＝「何を・どこで・いつ・どうやって〜すべきか」<table class=\"gref-tbl\"><tr><th>表現</th><th>意味</th><th>例</th></tr><tr><td><b>how to</b></td><td>〜の<b>しかた</b></td><td>how to make a cake</td></tr><tr><td><b>what to</b></td><td><b>何を</b>〜すべきか</td><td>what to buy</td></tr><tr><td><b>where to</b></td><td><b>どこで</b>〜すべきか</td><td>where to go</td></tr><tr><td><b>when to</b></td><td><b>いつ</b>〜すべきか</td><td>when to start</td></tr></table><span class=\"gref-warn\">⚠️ <b>why to〜は存在しない</b>！whyだけは使えない！</span><span class=\"gref-rel\">🔍 <b>疑問詞＋to＋動詞の原形</b>＝「<b>〜すべきか</b>」というひとかたまりの名詞句として、動詞の目的語などに使われる。<br><br>📐 比較で見るとわかりやすい：<br>・I don't know <b>what I should do</b>.（間接疑問文＝主語＋助動詞＋動詞）<br>・I don't know <b>what to do</b>.（疑問詞＋不定詞＝短く言える便利形）<br>→ 主語が省かれてシンプルになる<b>会話・記述で頻出の表現</b>。<br><br>🚫 <b>why to が存在しない理由</b>：他の疑問詞は「何を／どこで／いつ／どうやって」と<b>具体的な動作を含む</b>から、to + 動詞と相性◎。<br>・what to <b>buy</b>（何を買うか）／how to <b>get</b>（どう行くか）／where to <b>go</b>（どこへ行くか）<br>・しかし why（なぜ）は「<b>動作を尋ねるのではなく理由を尋ねる</b>」言葉。「なぜ〜すべきか」は意味的に「すべきか」よりも「理由」に焦点が当たるため、英語では <b>why to</b> を使わず、必ず<b>間接疑問文</b>（why I should do）で表す。<br><br>💡 中学英語の例外として確実に覚えるべきポイント。他はすべて「疑問詞 to」OK、why だけがNG。</span>","e":"I don't know <b>how to</b> get there.（そこへの行き方がわからない）\nPlease tell me <b>what to</b> do.（何をすべきか教えて）"},{"gr":"中3","t":"付加疑問文","d":"「〜ですよね？」と確認。<b>肯定→否定の付加 / 否定→肯定の付加</b><br><br>📌 You are a student, <b>aren't you</b>?（あなたは学生ですよね？）<br><br>📌 He can't swim, <b>can he</b>?（彼は泳げないですよね？）<br><span class=\"gref-tip\">💡 <b>作り方3ステップ</b>：<br>①肯定文→付加は<b>否定</b>。否定文→付加は<b>肯定</b><br>②主語を<b>代名詞</b>に(Tom→he)<br>③be動詞/助動詞をそのまま。一般動詞→do/does/did</span><br><span class=\"gref-warn\">⚠️ Let's→<b>shall we</b>? / 命令文→<b>will you</b>?</span><span class=\"gref-rel\">🔍 <b>なぜ反対形？</b>：付加疑問文は「念押し」「確認」の表現だから、<b>同じ形を繰り返さず「反対」</b>にすることで、確認のトーンを出している。<br><br>📐 You are a student, <b>aren't you</b>?（あなたは学生だ＋ですよね？）<br>・前半「You are a student」＝<b>自分の認識</b>を伝える<br>・後半「aren't you?」＝<b>反対の形で確認</b>＝「違うかな？」と相手に投げかける<br><br>🤝 もし「You are a student, are you?」と同じ形を繰り返すと<b>強調・驚きの意味</b>になってしまう。<b>反対にすることで「念押し・同意求め」のニュアンス</b>が生まれる。<br><br>🌏 日本語の「〜だよね？」「〜じゃない？」と同じ機能。<br><br>💡 <b>イレギュラー</b>：Let's〜は<b>shall we?</b>（勧誘への確認）、命令文は<b>will you?</b>（依頼に変える）。これも「2回目の表現で違う角度から確認」する共通パターン。</span>","e":"You are a student, <b>aren't you</b>?（あなたは学生ですよね？）\nTom likes pizza, <b>doesn't he</b>?（トムはピザが好きだよね？）"},{"gr":"中3","t":"仮定法過去","d":"「もし〜なら…だろうに」＝<b>現実と反対</b>を想像。<br><br>📌 <b>If+過去形, 主語+would/could+原形</b><br><span class=\"gref-warn\">⚠️ be動詞は主語に関係なく<b>were</b>！<br>× If I was → ○ If I <b>were</b></span><br><span class=\"gref-tip\">💡 見分け：過去形なのに「今の話」→<b>仮定法</b>！<br>If I <b>had</b> money, I <b>could</b> buy it.<br>→hadは過去形だけど「今」の話→仮定法！</span><span class=\"gref-rel\">🔍 <b>なぜ過去形なのに「今」の話？</b>：英語の過去形は実は<b>2つの役割</b>を持つ。<br><br>📐 ①<b>時間的な過去</b>：昨日のこと、去年のこと<br><br>📐 ②<b>現実からの距離</b>：あり得ないこと、想像の話<br><br>💡 「I had a million dollars.」と言われたら、ふつう「<b>今は持っていない</b>」とわかる。過去形を使うことで<b>「今の現実とは違う＝想像の話」</b>という距離感が自然に出る。<br><br>🌏 これは多くの言語に共通する仕組み。日本語でも<b>「もし宝くじが当たっ<b>たら</b>…」</b>と過去形（た形）を使うのと同じ感覚！<br><br>🚫 <b>be動詞は were だけ</b>：「If I were 〜」は、ふつうなら「I was」となるところを<b>あえて were にすることで「これは想像です」というシグナル</b>を強く出している。仮定法の特別な印。<br><br>📚 <b>発展：過去のことを仮定するときは「had+過去分詞」</b>：「もしあのとき〜していたら」と<b>過去の事実に反する仮定</b>は <b>If + 主語 + had + 過去分詞</b> で表す（仮定法過去完了）。教科書でも例文「If I had not met you, I would not be here.（もし出会わなかったら、今ここにいない）」のように、過去の仮定 ＋ 今の結果を組み合わせた形が出てくることがある。中学では深入りせず「<b>had + 過去分詞 が出てきたら過去のIF</b>」と知っておけばOK。</span>{{TPL:be}}","e":"If I had money, I <b>could</b> buy it.（お金があれば買えるのに）\nIf I <b>were</b> you, I <b>would</b> study harder.（もし私があなたなら、もっと勉強するのに）"},{"gr":"中3","t":"I wish+仮定法","d":"<b>I wish+主語+過去形</b>＝「〜だったら<b>いいのになぁ</b>」（現実は違う）<br><br>📌 I wish I <b>could</b> fly.（飛べたらいいのに）<br><br>📌 I wish I <b>were</b> taller.（もっと背が高ければなぁ）<br><span class=\"gref-tip\">💡 <b>I wish I could〜</b>は整序で頻出！丸暗記！</span><br><span class=\"gref-warn\">⚠️ hope（実現可能）≠ wish（実現不可能）<br>I <b>hope</b> it will be sunny. / I <b>wish</b> I were a bird.</span><span class=\"gref-rel\">🔍 <b>wish と hope の使い分けの本質</b>：両方「願う」と訳せるが、現実への距離が違う。<br>・<b>hope</b>＝<b>実現可能</b>な希望（現実とつながっている）<br>・<b>wish</b>＝<b>実現困難・不可能</b>な願望（現実と切れている）<br><br>📐 I <b>hope</b> it <b>will be</b> sunny tomorrow.（明日晴れるといいな←可能性あり）<br><br>📐 I <b>wish</b> I <b>were</b> a bird.（鳥だったらなぁ←現実ではあり得ない）<br><br>🎯 <b>なぜ wish の後ろは過去形？</b>：仮定法と同じ原理。<b>過去形＝現実からの距離</b>を表す。<br>・「I wish I <b>can</b> fly.」だと「飛べる」が現実っぽくなる<br>・「I wish I <b>could</b> fly.」と過去形にすることで「<b>現実は飛べない</b>」という距離感を出す<br><br>🌏 これは仮定法過去（#57）と同じ仕組み：<b>過去形が「現実とは違う」のサイン</b>。be 動詞は主語に関係なく <b>were</b>。<br><br>💡 <b>整序の頻出形</b>：<br>・I wish I <b>could</b> 〜（〜できたらいいのに）<br>・I wish I <b>were</b> 〜（〜だったらいいのに）<br>・I wish I <b>had</b> 〜（〜を持っていたらいいのに）<br>→ 「現状不可能・現実逆向き」の願望はすべて<b>過去形</b>で表す、と覚えれば応用が利く。</span>","e":"I wish I <b>could</b> fly.（飛べたらいいのに）\nI wish I <b>were</b> taller.（もっと背が高ければなぁ）"},{"gr":"中3","t":"so 〜 that … / such 〜 that …","d":"<b>「とても〜なので…」</b>。原因→結果をつなぐ。<table class=\"gref-tbl\"><tr><th>パターン</th><th>形</th></tr><tr><td><b>so</b></td><td>so+<b>形容詞/副詞</b>+that …</td></tr><tr><td><b>such</b></td><td>such (a)+形容詞+<b>名詞</b>+that …</td></tr></table><span class=\"gref-warn\">⚠️ 後ろが形容詞だけ→<b>so</b> / 名詞があれば→<b>such</b>。 so kind ↔ such a kind person</span><span class=\"gref-tip\">💡 <b>書き換え超頻出！</b> so 〜 that … <b>can't</b> = <b>too 〜 to</b> …<br>He is so tired that he can't walk. = He is too tired to walk.</span><span class=\"gref-rel\">🔍 <b>「程度→結果」を表す家族</b>：英語には「とても〜なので…」を表す表現がいくつかあって、形は違うが<b>意味の核は同じ</b>。<br>・<b>so + 形容詞・副詞 + that …</b>：so tired that I can't walk<br>・<b>such + (a) + 形容詞 + 名詞 + that …</b>：such a kind person that everyone likes him<br>・<b>too + 形容詞 + to do</b>：too tired to walk（次のカード参照）<br>・<b>形容詞 + enough to do</b>：tall enough to reach<br><br>🔄 <b>書き換えのカラクリ</b>：so tired <b>that</b> I <b>can't</b> walk = too tired <b>to</b> walk。否定の意味は too〜to の<b>「to に届かない」</b>感覚で自然に表れる。<br><br>💡 <b>so と such の選び方</b>：後ろが<b>形容詞だけ</b>なら so、<b>形容詞＋名詞</b>なら such。「a kind man」のように<b>名詞のかたまりに修飾する</b>時は such でまとめる。</span>","e":"It was <b>so</b> hot <b>that</b> I couldn't sleep.（とても暑くて眠れなかった）\nShe is <b>such a</b> kind girl <b>that</b> everyone likes her.（とても親切なので皆に好かれる）"},{"gr":"中3","t":"関係副詞（where / when）・what","d":"名詞を後ろから説明する発展形。<table class=\"gref-tbl\"><tr><th>語</th><th>説明する名詞</th><th>例</th></tr><tr><td><b>where</b></td><td>場所</td><td>the town where I live</td></tr><tr><td><b>when</b></td><td>時</td><td>the day when we met</td></tr><tr><td><b>what</b></td><td>（先行詞なし）</td><td>what I want（ほしいもの）</td></tr></table><span class=\"gref-tip\">💡 <b>what</b>＝the thing(s) which。「〜すること・〜するもの」。先行詞がいらない！ This is <b>what</b> I want.（これが私のほしいものだ）</span><span class=\"gref-warn\">⚠️ where/when は教科書により扱いが軽い発展事項。まず関係代名詞 who/which/that を固めてから！</span><span class=\"gref-rel\">🔍 <b>関係副詞は関係代名詞の「場所・時バージョン」</b>：<br>・<b>where</b>＝「その場所で」（in which / at which と同じ）<br>・<b>when</b>＝「その時に」（at which / on which と同じ）<br><br>📐 the town <b>in which</b> I live = the town <b>where</b> I live（私が住んでいる町）<br>→ 「前置詞＋関係代名詞」をスッキリ1語にまとめた<b>便利形</b>。<br><br>🎯 <b>what は特殊</b>：「<b>先行詞を中に含む関係代名詞</b>」。<br>・the thing(s) <b>which</b> I want → <b>what</b> I want（私のほしいもの）<br>・<b>先行詞＋which が一語にまとまった</b>のが what。だから先行詞を別に置く必要がない。<br><br>💡 まとめ：英語は<b>修飾の道具を発展させながら、より簡潔に表現できる形</b>を作ってきた。関係代名詞 → 関係副詞 → what と、後ろに行くほどコンパクト。</span>","e":"This is the house <b>where</b> he lives.（これが彼の住む家だ）\nTell me <b>what</b> you saw.（見たものを教えて）"},{"gr":"中1","t":"動詞 + 前置詞の熟語（look at / listen to）","d":"<b>動詞 + 前置詞</b>のセットで「〜を…する」という意味になる熟語。これらの動詞は単独では目的語をとれず、<b>前置詞があって初めて他動詞のように使える</b>。<table class=\"gref-tbl\"><tr><th>動詞句</th><th>意味</th><th>例</th></tr><tr><td><b>look at</b></td><td>〜を見る</td><td>Look at this.</td></tr><tr><td><b>listen to</b></td><td>〜を聞く</td><td>Listen to me.</td></tr><tr><td><b>wait for</b></td><td>〜を待つ</td><td>Wait for the bus.</td></tr><tr><td><b>look for</b></td><td>〜を探す</td><td>Look for the key.</td></tr><tr><td><b>arrive at</b></td><td>〜に着く</td><td>Arrive at the station.</td></tr><tr><td><b>get to</b></td><td>〜に着く</td><td>Get to school.</td></tr></table><span class=\"gref-warn\">⚠️ <b>look at</b>（意識して見る・atが必要）/ <b>see</b>（自然に目に入る・前置詞なし）/ <b>watch</b>（じっと観察する・前置詞なし）の使い分けが入試超頻出！<br>○ Look <b>at</b> the bird ／ ○ I can <b>see</b> the bird ／ ○ Watch TV</span><span class=\"gref-tip\">💡 これらの動詞は「自動詞」。目的語を取るには<b>前置詞をセットで覚える</b>のがコツ！熟語として丸暗記しよう。</span><span class=\"gref-rel\">🔍 <b>なぜ前置詞が必要？</b>：listen, look, wait などはもともと<b>「動作だけ」を表す自動詞</b>で、後ろに目的語を直接取れない。<br><br>📐 「I listen.」（聞いている）だけでは「何を？」が表せない。「私の話を聞いて」と言いたい時、<b>to me</b>（私の方向に）という<b>方向・対象を示す前置詞</b>が必要になる。<br><br>🤝 つまり前置詞が<b>「動作の方向・対象」を示すパートナー</b>になることで、初めて「〜を聞く」「〜を見る」と表現できる。<br><br>🆚 <b>see / watch との違い</b>：これらは最初から<b>他動詞</b>（目的語を直接取れる）。だから前置詞なしで「I see a bird.」「I watch TV.」と言える。<br><br>💡 listen <b>to</b> / look <b>at</b> / wait <b>for</b> / arrive <b>at</b> ←「動詞＋前置詞」を<b>1つのカタマリ</b>として覚えるのが入試的にも最効率。</span>","e":"<b>Look at</b> this picture.（この絵を見て）\nPlease <b>listen to</b> me.（私の話を聞いて）\nI <b>waited for</b> the bus.（バスを待った）"},{"gr":"中2","t":"句動詞（take off / put on など）","d":"<b>動詞 + 副詞</b>のセットで使う熟語。動詞だけでは想像できない意味になることが多い。<table class=\"gref-tbl\"><tr><th>句動詞</th><th>意味</th><th>例</th></tr><tr><td><b>take off</b></td><td>脱ぐ・離陸する</td><td>Take off your shoes.</td></tr><tr><td><b>put on</b></td><td>身につける</td><td>Put on your jacket.</td></tr><tr><td><b>pick up</b></td><td>拾う・迎えに行く</td><td>I'll pick you up.</td></tr><tr><td><b>turn on</b></td><td>つける</td><td>Turn on the light.</td></tr><tr><td><b>turn off</b></td><td>消す</td><td>Turn off the TV.</td></tr><tr><td><b>get up</b></td><td>起きる</td><td>I get up at 6.</td></tr><tr><td><b>look up</b></td><td>調べる</td><td>Look up the word.</td></tr></table><span class=\"gref-warn\">⚠️ 目的語が<b>代名詞</b>のときは動詞と副詞の<b>間に入れる</b>！<br>○ Take <b>it</b> off ／ × Take off <b>it</b><br>※名詞の目的語ならどちらでもOK：Take off your hat = Take your hat off</span><span class=\"gref-tip\">💡 自動詞+前置詞（look at）との見分け：句動詞は代名詞を<b>間に挟める</b>のが特徴。Look at <b>it</b>（at it のまま）vs Pick <b>it</b> up（it を間に！）</span><span class=\"gref-rel\">🔍 <b>句動詞の正体</b>：動詞＋<b>副詞</b>の組み合わせで、<b>意味が新しい単語に化ける</b>のが特徴。<br>・take（取る）＋ off（離れる）＝ <b>脱ぐ／離陸する</b><br>・pick（つまむ）＋ up（上に）＝ <b>拾う／迎えに行く</b><br>・turn（回す）＋ on（つく）＝ <b>電源を入れる</b><br><br>📐 動詞だけの意味からは想像できない意味になることが多い。だから1つの<b>新しい単語</b>として覚える必要がある。<br><br>🤝 <b>動詞+前置詞（look at）との違い</b>：<br>・<b>句動詞は「動詞＋副詞」</b>：副詞は<b>移動可能</b>。代名詞を間に入れられる（pick <b>it</b> up）。<br>・<b>動詞+前置詞は「動詞＋前置詞」</b>：前置詞は<b>名詞の前から離れない</b>。代名詞を間に入れられない（look <b>at it</b>）。<br><br>💡 文法的な役割（副詞 vs 前置詞）の違いが、語順の柔軟さに現れる。</span>","e":"Please <b>take off</b> your shoes.（靴を脱いでください）\n<b>Turn on</b> the light.（電気をつけて）\nI <b>picked up</b> the pen.（ペンを拾った）"},{"gr":"中3","t":"前置詞句の後置修飾（the book on the desk）","d":"名詞のうしろに<b>前置詞句</b>（on the desk, in the room など）を置いて「<b>〜にある…</b>」「<b>〜の…</b>」と説明する形。<br><br>📌 the book <b>on the desk</b>（机の上の本）/ the man <b>in the car</b>（車の中の男性）<table class=\"gref-tbl\"><tr><th>前置詞</th><th>例</th><th>意味</th></tr><tr><td>on</td><td>the book <b>on</b> the desk</td><td>机の上の本</td></tr><tr><td>in</td><td>the boy <b>in</b> the room</td><td>部屋の中の男の子</td></tr><tr><td>under</td><td>the cat <b>under</b> the chair</td><td>椅子の下の猫</td></tr><tr><td>with</td><td>a girl <b>with</b> blue eyes</td><td>青い目の女の子</td></tr><tr><td>of</td><td>a friend <b>of</b> mine</td><td>私の友達</td></tr><tr><td>from</td><td>a letter <b>from</b> Tom</td><td>トムからの手紙</td></tr></table><span class=\"gref-warn\">⚠️ 日本語と語順が<b>逆</b>！<br>日本語：<b>机の上の</b>本（前から修飾）<br>英語：the book <b>on the desk</b>（後ろから修飾）</span><span class=\"gref-tip\">💡 <b>後置修飾の5パターン</b>：<b>前置詞句</b> / <b>不定詞</b>（to+原形）/ <b>現在分詞</b>（〜ing）/ <b>過去分詞</b> / <b>関係代名詞節</b>。すべて名詞の<b>うしろ</b>に置いて説明する形！中3で関係代名詞を習う前の土台になるよ。</span><span class=\"gref-rel\">🔍 <b>英語は「名詞→説明」の順で並べる言語</b>：日本語と逆。<br>・日本語：<b>机の上の</b>本（前から説明）<br>・英語：the book <b>on the desk</b>（後ろから説明）<br><br>📐 <b>後置修飾の5パターン</b>（短いものから長いものへ）：<br>① <b>前置詞句</b>：the book <b>on the desk</b>（机の上の本）<br>② <b>不定詞</b>：something <b>to drink</b>（飲むためのもの）<br>③ <b>現在分詞</b>：the boy <b>playing tennis</b>（テニスをしている少年）<br>④ <b>過去分詞</b>：a book <b>written in English</b>（英語で書かれた本）<br>⑤ <b>関係代名詞節（中3で習う）</b>：a friend <b>who lives in Tokyo</b>（東京に住んでいる友達）<br><br>🌱 すべて<b>「名詞のうしろから飾る」共通の構造</b>。短いもの（前置詞句）から長いもの（関係代名詞節）まで、英語は一貫してこの順序。<br><br>💡 だから後置修飾に慣れると、関係代名詞もスムーズに入ってくる。</span>","e":"the book <b>on the desk</b>（机の上の本）\nthe boy <b>in the red shirt</b>（赤シャツの男の子）\nThe man <b>by the door</b> is my father.（ドアのそばの男性は父です）"}];

// ============================================================
// APP LOGIC
// ============================================================
let S={mode:null,qs:[],idx:0,score:0,wrong:[],streak:0,total:0,answered:false,convSlot:0,convFilled:[],orderSel:[]};

function init(){
  document.getElementById('tc').textContent=tekigoQ.length+'問';
  document.getElementById('gc').textContent=gokeiQ.length+'問';
  document.getElementById('sc').textContent=seijoQ.length+'問';
  document.getElementById('kc').textContent=kaiwaQ.length+'問';
  try{S.total=parseInt(localStorage.getItem('jc_t')||'0');S.streak=parseInt(localStorage.getItem('jc_s')||'0')}catch(e){}
  updStats();buildGrammarHome();buildGrammarRef();buildVocab();
}

function updStats(){
  document.getElementById('streakCount').textContent=S.streak;
  document.getElementById('totalCorrect').textContent=S.total;
  try{localStorage.setItem('jc_t',S.total);localStorage.setItem('jc_s',S.streak)}catch(e){}
}

function showPage(p){if(p!=='results')SFX.play('click');
  document.querySelectorAll('.pg').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.nav-i').forEach(x=>x.classList.remove('on'));
  var m={home:'homePage',grammar:'grammarPage',vocab:'vocabPage',quiz:'quizPage',results:'resultsPage'};
  document.getElementById(m[p]).classList.add('on');
  var b=document.querySelector('.nav-i[data-p="'+p+'"]');if(b)b.classList.add('on');
}

function goHome(){showPage('home')}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function buildGrammarHome(){
  var all=[];
  tekigoQ.forEach(function(q){all.push({g:q.g,orig:q})});
  gokeiQ.forEach(function(q){all.push({g:q.g,orig:q})});
  seijoQ.forEach(function(q){all.push({g:q.g,orig:q})});
  kaiwaQ.forEach(function(q){all.push({g:q.g,orig:q})});
  var gm={};all.forEach(function(x){if(!gm[x.g])gm[x.g]=[];gm[x.g].push(x)});
  // 添付の文法体系に基づく学年別・表示順の定義
  var gradeOrder={
    "中1":["be動詞・一般動詞","時制（過去・進行・未来）","代名詞・語彙・熟語","疑問詞","助動詞"],
    "中2":["不定詞・動名詞","比較","受動態","会話表現"],
    "中3":["現在完了","間接疑問文","分詞","関係代名詞","仮定法"]
  };
  var cols=['#FF6B9D','#A07CE8','#4ECDA5','#FFA15C','#5CB8FF','#FFD644','#FF8A9E','#7ECBA1'];
  var h='';var ci=0;
  ['中1','中2','中3'].forEach(function(gr){
    var ordered=gradeOrder[gr];if(!ordered||ordered.length===0)return;
    var gc=gr==='中1'?'g1':gr==='中2'?'g2':'g3';
    h+='<div style="margin-bottom:6px;margin-top:14px"><span class="gref-grade '+gc+'" style="font-size:12px;padding:3px 12px">'+gr+'</span></div>';
    ordered.forEach(function(tag){
      var cnt=gm[tag]?gm[tag].length:0;
      if(cnt===0)return;
      var safeTag=tag.replace(/'/g,"\\'");
      h+='<div class="gchip" onclick="startGrammarQ(\'' + safeTag + '\')">';  
      h+='<div class="gchip-l"><div class="gdot" style="background:'+cols[ci%cols.length]+'"></div>';
      h+='<span class="gchip-n">'+tag+'</span></div>';
      h+='<span class="gchip-c">'+cnt+'問</span></div>';
      ci++;
    });
  });
  document.getElementById('grammarList').innerHTML=h;
}

function startGrammarQ(g){
  var all=[];
  tekigoQ.forEach(function(q){if(q.g===g)all.push(q)});
  gokeiQ.forEach(function(q){if(q.g===g)all.push(q)});
  seijoQ.forEach(function(q){if(q.g===g)all.push(q)});
  kaiwaQ.forEach(function(q){if(q.g===g)all.push(q)});
  if(all.length===0)return;
  S.mode=all[0].bank?'gokei':(all[0].p?'seijoEisaku':(all[0].ctx!==undefined?'kaiwa':'tekigo'));
  S.qs=shuffle(all.slice());S.idx=0;S.score=0;S.wrong=[];S.answered=false;S.showGrammarTag=true;
  showPage('quiz');renderQ();
}


function startQuiz(mode){
  S.mode=mode;
  var qs;
  if(mode==='tekigo')qs=tekigoQ.slice();
  else if(mode==='gokei')qs=gokeiQ.slice();
  else if(mode==='seijoEisaku')qs=seijoQ.slice();
  else if(mode==='kaiwa')qs=kaiwaQ.slice();
  S.qs=shuffle(qs);S.idx=0;S.score=0;S.wrong=[];S.answered=false;S.showGrammarTag=false;
  showPage('quiz');renderQ();
}

function retryQuiz(){
  S.qs=shuffle(S.qs.slice());S.idx=0;S.score=0;S.wrong=[];S.answered=false;
  showPage('quiz');renderQ();
}

function renderQ(){
  var q=S.qs[S.idx],tot=S.qs.length,n=S.idx+1;
  document.getElementById('quizCounter').textContent=n+' / '+tot;
  document.getElementById('qfill').style.width=(n/tot*100)+'%';
  S.answered=false;
  if('ctx' in q) renderKaiwa(q);
  else if(q.bank) renderGokei(q);
  else if(q.p) renderSeijo(q);
  else if(Array.isArray(q.a)) renderMultiTekigo(q);
  else renderTekigo(q);
}

// TEKIGO
function renderTekigo(q){
  var lbl=['ア','イ','ウ','エ','オ','カ','キ','ク'];
  // Shuffle choices
  var shuffled=q.ch.slice();
  for(var i=shuffled.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=t}
  var qt=q.q.replace(/\(    \)/g,'<span style="color:var(--pink);font-weight:700;border-bottom:2.5px dashed var(--pink);padding:0 8px">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  var h='<div class="qcard">'+(S.showGrammarTag?'<span class="qtag qtag-g">'+q.g+'</span>':'')+'<span class="qtag qtag-t">適語選択</span><div class="qtxt">'+qt+'</div></div><div class="choices" id="chC">';
  shuffled.forEach(function(c,i){
    h+='<button class="cbtn" data-v="'+c.replace(/"/g,'&quot;')+'"><span class="clbl">'+lbl[i]+'</span><span>'+c+'</span></button>';
  });
  h+='</div><div class="result-banner" id="rbanner"></div><div class="ebox" id="ebox"><div class="ebox-t">'+(q.ex||'<b>正解は「'+q.a+'」</b>✨<br>文法：'+q.g)+'</div></div>';
  h+='<button class="peekbtn" id="peekbtn" onclick="peekAnswer()">💡 答えを見る</button><button class="nbtn" id="nbtn" onclick="nextQ()">次の問題 →</button>';
  document.getElementById('quizContent').innerHTML=h;
  document.querySelectorAll('#chC .cbtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(S.answered)return;S.answered=true;
      var val=this.dataset.v;var ok=val===q.a;
      if(ok){this.classList.add('ok');S.score++;S.streak++;S.total++;SFX.play('correct')}
      else{this.classList.add('ng');S.streak=0;S.wrong.push(q);SFX.play('wrong');
        document.querySelectorAll('#chC .cbtn').forEach(function(b){if(b.dataset.v===q.a)b.classList.add('ok')});
      }
      document.querySelectorAll('#chC .cbtn').forEach(function(b){b.classList.add('dis')});
      var rb=document.getElementById('rbanner');
      if(ok){rb.textContent='⭕ 正解！';rb.className='result-banner show ok-banner'}
      else{rb.textContent='❌ 不正解…';rb.className='result-banner show ng-banner'}
      document.getElementById('ebox').classList.add('show');
      document.getElementById('peekbtn').classList.add('hide');
      document.getElementById('nbtn').classList.add('show');
      updStats();
    });
  });
}

// MULTI-TEKIGO (multiple blanks: ①②③ from choices ア〜カ)
function renderMultiTekigo(q){
  var slotCount=q.a.length;
  S.mtFilled=new Array(slotCount).fill(null);S.mtSlot=0;
  var qt=q.q;
  // Replace ① ② ③ markers in the question text for display
  for(var si=0;si<slotCount;si++){
    var marker='( '+'①②③④⑤'[si]+' )';
    qt=qt.replace(marker,'<span style="color:var(--pink);font-weight:700;border-bottom:2.5px dashed var(--pink);padding:0 4px">( '+'①②③④⑤'[si]+' )</span>');
  }
  var h='<div class="qcard">'+(S.showGrammarTag?'<span class="qtag qtag-g">'+q.g+'</span>':'')+'<span class="qtag qtag-t">適語選択</span><div class="qtxt">'+qt+'</div></div>';
  h+='<div class="stitle" style="font-size:13px">①〜③に入る語を順番に選んでください：</div>';
  h+='<div class="mt-slots" id="mtSlots">';
  for(var i=0;i<slotCount;i++){
    h+='<div class="mt-slot'+(i===0?' act':'')+'" data-si="'+i+'"><span class="mt-snum">'+'①②③④⑤'[i]+'</span><span class="mt-stxt" id="mts'+i+'">タップして選択</span></div>';
  }
  h+='</div>';
  h+='<div class="mt-choices" id="mtChs">';
  q.ch.forEach(function(c,i){
    h+='<button class="mt-cbtn" data-ci="'+i+'">'+c+'</button>';
  });
  h+='</div>';
  h+='<button class="chkbtn" id="mtChk" disabled>回答する</button>';
  h+='<div class="corr" id="corr">正解：'+q.a.join('・')+'</div>';
  h+='<div class="result-banner" id="rbanner"></div><div class="ebox" id="ebox"><div class="ebox-t">'+(q.ex||'<b>正解：'+q.a.join('・')+'</b>')+'</div></div>';
  h+='<button class="peekbtn" id="peekbtn" onclick="peekAnswer()">💡 答えを見る</button><button class="nbtn" id="nbtn" onclick="nextQ()">次の問題 →</button>';
  document.getElementById('quizContent').innerHTML=h;

  // Slot click: tap filled slot to clear, or select a slot
  document.querySelectorAll('#mtSlots .mt-slot').forEach(function(el){
    el.addEventListener('click',function(){
      if(S.answered)return;
      var si=parseInt(this.dataset.si);
      if(S.mtFilled[si]!==null){
        var ci=S.mtFilled[si];
        S.mtFilled[si]=null;
        this.classList.remove('filled');
        document.getElementById('mts'+si).textContent='タップして選択';
        document.querySelectorAll('#mtChs .mt-cbtn')[ci].classList.remove('used');
        document.getElementById('mtChk').disabled=true;
      }
      S.mtSlot=si;
      document.querySelectorAll('#mtSlots .mt-slot').forEach(function(s,i){s.classList.toggle('act',i===si)});
    });
  });

  // Choice click
  document.querySelectorAll('#mtChs .mt-cbtn').forEach(function(el){
    el.addEventListener('click',function(){
      if(S.answered)return;
      var ci=parseInt(this.dataset.ci),si=S.mtSlot;
      // Unfill prev choice in this slot
      var prev=S.mtFilled[si];
      if(prev!==null)document.querySelectorAll('#mtChs .mt-cbtn')[prev].classList.remove('used');
      // Remove this choice from any other slot
      var esi=S.mtFilled.indexOf(ci);
      if(esi!==-1){S.mtFilled[esi]=null;var s=document.querySelectorAll('#mtSlots .mt-slot')[esi];s.classList.remove('filled');document.getElementById('mts'+esi).textContent='タップして選択'}
      // Fill slot
      S.mtFilled[si]=ci;
      var slot=document.querySelectorAll('#mtSlots .mt-slot')[si];slot.classList.add('filled');
      document.getElementById('mts'+si).textContent=q.ch[ci];
      this.classList.add('used');
      // Auto-advance to next empty slot
      var ne=S.mtFilled.findIndex(function(x){return x===null});
      if(ne!==-1){S.mtSlot=ne;document.querySelectorAll('#mtSlots .mt-slot').forEach(function(s,i){s.classList.toggle('act',i===ne)})}
      document.getElementById('mtChk').disabled=!S.mtFilled.every(function(x){return x!==null});
    });
  });

  // Check answer
  document.getElementById('mtChk').addEventListener('click',function(){
    if(S.answered)return;S.answered=true;
    // Extract the ア/イ/ウ... label from each chosen answer
    var ua=S.mtFilled.map(function(ci){return q.ch[ci].charAt(0)});
    var ok=JSON.stringify(ua)===JSON.stringify(q.a);
    if(ok){S.score++;S.streak++;S.total++;SFX.play('correct');document.querySelectorAll('#mtSlots .mt-slot').forEach(function(s){s.style.borderColor='var(--ok)'})}
    else{S.streak=0;S.wrong.push(q);SFX.play('wrong');document.querySelectorAll('#mtSlots .mt-slot').forEach(function(s){s.style.borderColor='var(--ng)'});document.getElementById('corr').classList.add('show')}
    document.getElementById('mtChk').disabled=true;
    // Disable choice buttons
    document.querySelectorAll('#mtChs .mt-cbtn').forEach(function(b){b.style.pointerEvents='none'});
    var rb=document.getElementById('rbanner');
    if(ok){rb.textContent='⭕ 正解！';rb.className='result-banner show ok-banner'}
    else{rb.textContent='❌ 不正解…';rb.className='result-banner show ng-banner'}
    document.getElementById('ebox').classList.add('show');document.getElementById('peekbtn').classList.add('hide');document.getElementById('nbtn').classList.add('show');updStats();
  });
}

// GOKEI
function renderGokei(q){
  var qt=q.q.replace(/\(    \)/g,'<span style="color:var(--pink);font-weight:700;border-bottom:2.5px dashed var(--pink);padding:0 8px">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  var h='<div class="qcard">'+(S.showGrammarTag?'<span class="qtag qtag-g">'+q.g+'</span>':'')+'<span class="qtag qtag-t">語形変化</span><div class="qtxt">'+qt+'</div></div>';
  h+='<div><input type="text" class="ainput" id="gi" placeholder="答えを入力..." autocomplete="off" autocapitalize="off" spellcheck="false">';
  h+='<button class="subbtn" id="gsub">回答する</button></div>';
  h+='<div class="corr" id="corr">正解：'+q.a+'</div>';
  h+='<div class="result-banner" id="rbanner"></div><div class="ebox" id="ebox"><div class="ebox-t">'+(q.ex||'<b>正解は「'+q.a+'」</b>✨<br>文法：'+q.g)+'</div></div>';
  h+='<button class="peekbtn" id="peekbtn" onclick="peekAnswer()">💡 答えを見る</button><button class="nbtn" id="nbtn" onclick="nextQ()">次の問題 →</button>';
  document.getElementById('quizContent').innerHTML=h;
  var inp=document.getElementById('gi'),sub=document.getElementById('gsub');
  function doCheck(){
    if(S.answered)return;S.answered=true;
    var v=inp.value.trim().toLowerCase(),ok=v===q.a.toLowerCase();
    if(ok){inp.classList.add('ok');S.score++;S.streak++;SFX.play('correct');S.total++}
    else{inp.classList.add('ng');S.streak=0;S.wrong.push(q);SFX.play('wrong');document.getElementById('corr').classList.add('show')}
    inp.disabled=true;sub.disabled=true;
    var rb=document.getElementById('rbanner');
    if(ok){rb.textContent='⭕ 正解！';rb.className='result-banner show ok-banner'}
    else{rb.textContent='❌ 不正解…';rb.className='result-banner show ng-banner'}
    document.getElementById('ebox').classList.add('show');document.getElementById('peekbtn').classList.add('hide');document.getElementById('nbtn').classList.add('show');updStats();
  }
  sub.addEventListener('click',doCheck);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')doCheck()});
}

// SEIJO
function renderSeijo(q){
  var qt=q.q.replace(/\(    \)/g,'<span style="color:var(--pink);font-weight:700;border-bottom:2.5px dashed var(--pink);padding:0 8px">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  S.orderSel=[];
  var h='<div class="qcard">'+(S.showGrammarTag?'<span class="qtag qtag-g">'+q.g+'</span>':'')+'<span class="qtag qtag-t">整序英作文</span><div class="qtxt">'+qt+'</div></div>';
  h+='<div class="oslots" id="osl"></div><div class="ochoices" id="och">';
  q.p.forEach(function(p,i){h+='<div class="ochip" data-i="'+i+'">'+p.l+' '+p.t+'</div>'});
  h+='</div><button class="chkbtn" id="chkb" disabled>回答する</button>';
  h+='<div class="corr" id="corr">正解：'+q.a.join('→')+'</div>';
  var defEx='<b>正解：'+q.a.join('→')+'</b>✨<br>（'+q.a.map(function(l){var pp=q.p.find(function(x){return x.l===l});return pp?pp.t:''}).join(' ')+'）<br>文法：<b>'+q.g+'</b>';
  h+='<div class="result-banner" id="rbanner"></div><div class="ebox" id="ebox"><div class="ebox-t">'+(q.ex||defEx)+'</div></div>';
  h+='<button class="peekbtn" id="peekbtn" onclick="peekAnswer()">💡 答えを見る</button><button class="nbtn" id="nbtn" onclick="nextQ()">次の問題 →</button>';
  document.getElementById('quizContent').innerHTML=h;
  document.querySelectorAll('#och .ochip').forEach(function(el){
    el.addEventListener('click',function(){
      if(S.answered)return;
      var i=parseInt(this.dataset.i);
      if(this.classList.contains('placed')){S.orderSel=S.orderSel.filter(function(x){return x!==i});this.classList.remove('placed')}
      else{S.orderSel.push(i);this.classList.add('placed')}
      updSlots(q);
    });
  });
  document.getElementById('chkb').addEventListener('click',function(){
    if(S.answered)return;S.answered=true;
    var ua=S.orderSel.map(function(i){return q.p[i].l});
    var ok=JSON.stringify(ua)===JSON.stringify(q.a);
    var sl=document.getElementById('osl');
    if(ok){sl.classList.add('ok');S.score++;S.streak++;SFX.play('correct');S.total++}
    else{sl.classList.add('ng');S.streak=0;S.wrong.push(q);SFX.play('wrong');document.getElementById('corr').classList.add('show')}
    document.getElementById('chkb').disabled=true;
    var rb=document.getElementById('rbanner');
    if(ok){rb.textContent='⭕ 正解！';rb.className='result-banner show ok-banner'}
    else{rb.textContent='❌ 不正解…';rb.className='result-banner show ng-banner'}
    document.getElementById('ebox').classList.add('show');document.getElementById('peekbtn').classList.add('hide');document.getElementById('nbtn').classList.add('show');updStats();
  });
}

function updSlots(q){
  var sl=document.getElementById('osl');
  sl.innerHTML=S.orderSel.map(function(i){var p=q.p[i];return'<div class="ochip ins" data-ri="'+i+'">'+p.l+' '+p.t+'</div>'}).join('');
  sl.querySelectorAll('.ochip').forEach(function(el){
    el.addEventListener('click',function(){
      if(S.answered)return;
      var ri=parseInt(this.dataset.ri);
      S.orderSel=S.orderSel.filter(function(x){return x!==ri});
      document.querySelectorAll('#och .ochip').forEach(function(c){if(parseInt(c.dataset.i)===ri)c.classList.remove('placed')});
      updSlots(q);
    });
  });
  document.getElementById('chkb').disabled=S.orderSel.length!==q.a.length;
}

// KAIWA
function renderKaiwa(q){
  S.convFilled=new Array(q.s).fill(null);S.convSlot=0;
  let h=`<div class="qcard">${S.showGrammarTag?`<span class="qtag qtag-g">${q.g}</span>`:''}<span class="qtag qtag-t">会話文の完成</span><div class="qtxt">${q.ctx}</div></div>
  <div class="stitle" style="font-size:13px">正しい順番に選んでください：</div>
  <div class="cslots" id="csvs">${Array.from({length:q.s},(_,i)=>`<div class="cslot ${i===0?'act':''}" data-si="${i}"><span class="csnum">${i+1}</span><span class="cstxt" id="cst${i}">タップして選択</span></div>`).join('')}</div>
  <div class="cchoices" id="cchs">${q.ch.map((c,i)=>`<button class="ccbtn" data-ci="${i}">${c}</button>`).join('')}</div>
  <button class="chkbtn" id="chkc" disabled>回答する</button>
  <div class="corr" id="corr">正解：${q.a.join(' → ')}</div>
  <div class="result-banner" id="rbanner"></div><div class="ebox" id="ebox"><div class="ebox-t">${q.ex||('<b>正解：'+q.a.join(' → ')+'</b><br>'+q.a.map((a,i)=>{const c=q.ch.find(x=>x.charAt(0)===a);return '<b>'+(i+1)+'.</b> '+(c||a)}).join('<br>'))}</div></div>
  <button class="peekbtn" id="peekbtn" onclick="peekAnswer()">💡 答えを見る</button><button class="nbtn" id="nbtn" onclick="nextQ()">次の問題 →</button>`;
  document.getElementById('quizContent').innerHTML=h;

  // Slot click - tap filled slot to clear it
  document.querySelectorAll('#csvs .cslot').forEach(el=>{
    el.addEventListener('click',function(){
      if(S.answered)return;
      var si=parseInt(this.dataset.si);
      // If this slot is filled and we tap it again, clear it
      if(S.convFilled[si]!==null){
        var ci=S.convFilled[si];
        S.convFilled[si]=null;
        this.classList.remove('filled');
        document.getElementById('cst'+si).textContent='タップして選択';
        document.querySelectorAll('#cchs .ccbtn')[ci].classList.remove('used');
        document.getElementById('chkc').disabled=true;
      }
      S.convSlot=si;
      document.querySelectorAll('#csvs .cslot').forEach(function(s,i){s.classList.toggle('act',i===si)});
    });
  });
  // Choice click
  document.querySelectorAll('#cchs .ccbtn').forEach(el=>{
    el.addEventListener('click',function(){
      if(S.answered)return;
      const ci=parseInt(this.dataset.ci),si=S.convSlot;
      // Unfill prev
      const prev=S.convFilled[si];
      if(prev!==null)document.querySelectorAll('#cchs .ccbtn')[prev].classList.remove('used');
      // Remove from other slot
      const esi=S.convFilled.indexOf(ci);
      if(esi!==-1){S.convFilled[esi]=null;const s=document.querySelectorAll('#csvs .cslot')[esi];s.classList.remove('filled');document.getElementById('cst'+esi).textContent='タップして選択'}
      // Fill
      S.convFilled[si]=ci;
      const slot=document.querySelectorAll('#csvs .cslot')[si];slot.classList.add('filled');
      document.getElementById('cst'+si).textContent=q.ch[ci];
      this.classList.add('used');
      // Auto next
      const ne=S.convFilled.findIndex(x=>x===null);
      if(ne!==-1){S.convSlot=ne;document.querySelectorAll('#csvs .cslot').forEach((s,i)=>s.classList.toggle('act',i===ne))}
      document.getElementById('chkc').disabled=!S.convFilled.every(x=>x!==null);
    });
  });
  // Check
  document.getElementById('chkc').addEventListener('click',()=>{
    if(S.answered)return;S.answered=true;
    const ua=S.convFilled.map(i=>q.ch[i].charAt(0));
    const ok=JSON.stringify(ua)===JSON.stringify(q.a);
    if(ok){S.score++;S.streak++;S.total++;SFX.play('correct');document.querySelectorAll('#csvs .cslot').forEach(s=>s.style.borderColor='var(--ok)')}
    else{S.streak=0;S.wrong.push(q);SFX.play('wrong');document.querySelectorAll('#csvs .cslot').forEach(s=>s.style.borderColor='var(--ng)');document.getElementById('corr').classList.add('show')}
    document.getElementById('chkc').disabled=true;
    var rb=document.getElementById('rbanner');
    if(ok){rb.textContent='⭕ 正解！';rb.className='result-banner show ok-banner'}
    else{rb.textContent='❌ 不正解…';rb.className='result-banner show ng-banner'}
    document.getElementById('ebox').classList.add('show');document.getElementById('peekbtn').classList.add('hide');document.getElementById('nbtn').classList.add('show');updStats();
  });
}

function peekAnswer(){
  if(S.answered)return;S.answered=true;
  S.streak=0;
  var q=S.qs[S.idx];
  // Mark as wrong (skipped)
  S.wrong.push(q);
  // Show correct answer visually depending on question type
  var chBtns=document.querySelectorAll('#chC .cbtn');
  if(chBtns.length>0){
    chBtns.forEach(function(b){if(b.dataset.v===q.a)b.classList.add('ok');b.classList.add('dis')});
  }
  var inp=document.getElementById('ginp');
  if(inp){inp.disabled=true;inp.value=q.a;inp.classList.add('ok');var sub=document.getElementById('gsub');if(sub)sub.disabled=true;var corr=document.getElementById('corr');if(corr)corr.classList.add('show')}
  var osl=document.getElementById('osl');
  if(osl){osl.classList.add('ng');var chkb=document.getElementById('chkb');if(chkb)chkb.disabled=true;var corr=document.getElementById('corr');if(corr)corr.classList.add('show')}
  var chkc=document.getElementById('chkc');
  if(chkc){chkc.disabled=true;document.querySelectorAll('#csvs .cslot').forEach(function(s){s.style.borderColor='var(--ng)'});var corr=document.getElementById('corr');if(corr)corr.classList.add('show')}
  // Multi-tekigo peek
  var mtChk=document.getElementById('mtChk');
  if(mtChk){mtChk.disabled=true;document.querySelectorAll('#mtSlots .mt-slot').forEach(function(s){s.style.borderColor='var(--ng)';s.style.pointerEvents='none'});document.querySelectorAll('#mtChs .mt-cbtn').forEach(function(b){b.style.pointerEvents='none'});var corr=document.getElementById('corr');if(corr)corr.classList.add('show')}
  // Show banner as skipped
  var rb=document.getElementById('rbanner');
  rb.textContent='👀 答えを確認';rb.className='result-banner show ng-banner';
  document.getElementById('ebox').classList.add('show');
  document.getElementById('nbtn').classList.add('show');
  document.getElementById('peekbtn').classList.add('hide');
  SFX.play('wrong');
  updStats();
}
function nextQ(){
  SFX.play('click');
  S.idx++;
  if(S.idx>=S.qs.length)showResults();
  else{renderQ();window.scrollTo(0,0)}
}

function showResults(){
  const t=S.qs.length,p=Math.round((S.score/t)*100);
  document.getElementById('rscore').textContent=p+'%';
  document.getElementById('rcorr').textContent=S.score;
  document.getElementById('rwrong').textContent=t-S.score;
  document.getElementById('rtotal').textContent=t;
  const rv=document.getElementById('wrongReview');
  if(S.wrong.length===0)rv.innerHTML='<div style="text-align:center;color:var(--ok);padding:20px">🎉 全問正解！すばらしい！</div>';
  else{let h='';S.wrong.forEach(q=>{const qt=(q.q||q.ctx||'').substring(0,60);h+=`<div class="gchip" style="cursor:default"><div class="gchip-l"><div class="gdot" style="background:var(--ng)"></div><div><div class="gchip-n" style="font-size:12px">${q.g}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${qt}...</div></div></div></div>`});rv.innerHTML=h}
  if(S.score===S.qs.length)SFX.play('perfect');else SFX.play('done');showPage('results');
}

// GRAMMAR REF
function buildGrammarRef(){
  renderGRefs('all');
}
function renderGRefs(cat){
  var list=cat==='all'?grammarRef:grammarRef.filter(function(g){return g.gr===cat});
  var h='';list.forEach(function(g){
    var gc=g.gr==='中1'?'g1':g.gr==='中2'?'g2':'g3';
    h+='<div class="gref" data-gr="'+g.gr+'"><span class="gref-grade '+gc+'">'+g.gr+'</span>';
    h+='<div class="gref-t">'+g.t+'</div><div class="gref-d">'+expandTpl(g.d)+'</div>';
    h+='<div class="gref-e">'+g.e.replace(/\n/g,'<br>')+'</div></div>';
  });
  document.getElementById('grammarRefList').innerHTML=h;
}
function fgCat(btn,cat){
  document.querySelectorAll('#gTabs .ftab').forEach(function(t){t.classList.remove('on')});
  btn.classList.add('on');renderGRefs(cat);
}
function filterGrammar(){
  var q=document.getElementById('gSearch').value.toLowerCase();
  document.querySelectorAll('#grammarRefList .gref').forEach(function(c){c.style.display=c.textContent.toLowerCase().includes(q)?'':'none'});
}

function showVocabHome(){
  var cl=document.getElementById('vCatList');
  var el=document.getElementById('vocabList');
  el.innerHTML='';
  var h='';
  for(var grp in vocabGroups){
    h+=`<div class="vcat-group">${grp}</div>`;
    vocabGroups[grp].forEach(function(cat){
      var n=vocabData[cat]?vocabData[cat].length:0;
      h+=`<div class="vcat-item" onclick="SFX.play('click');showVocabCat('${cat.replace(/'/g,"\\'")}')"><span class="vci-name">${cat}</span><span class="vci-count">${n}語</span></div>`;
    });
  }
  h+=`<div class="vcat-group">📖 すべて表示</div>`;
  h+=`<div class="vcat-item" onclick="SFX.play('click');showVocabCat('all')"><span class="vci-name">全カテゴリ一覧</span><span class="vci-count">${Object.values(vocabData).reduce(function(a,b){return a+b.length},0)}語</span></div>`;

}
function showVocabCat(cat){
  var cl=document.getElementById('vCatList');
  cl.innerHTML='';
  var el=document.getElementById('vocabList');

  });

}
function rvList(cat){showVocabCat(cat)}
function fvCat(btn,cat){showVocabCat(cat)}
function filterVocab(){
  var q=document.getElementById('vSearch').value.toLowerCase();
  if(q.length>0){
    var cl=document.getElementById('vCatList');cl.innerHTML='';
    var el=document.getElementById('vocabList');
